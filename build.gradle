plugins {
   id 'java'
   id 'org.springframework.boot' version '3.2.9'
   id 'io.spring.dependency-management' version '1.1.6'
}

group = 'amadda'
version = '0.0.1-SNAPSHOT'

java {
   toolchain {
      languageVersion = JavaLanguageVersion.of(17)
   }
}

configurations {
   compileOnly {
      extendsFrom annotationProcessor
   }
}

repositories {
   mavenCentral()
}

dependencies {

   // XML 바인딩을 위한 JAXB 의존성추가
	implementation 'org.glassfish.jaxb:jaxb-runtime:3.0.2'
   implementation 'jakarta.xml.bind:jakarta.xml.bind-api:3.0.1'
   implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
   implementation 'org.springframework.boot:spring-boot-starter-web'
   implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

   // 원준 추가
   // ModelMapper 의존성 추가
   implementation 'org.modelmapper:modelmapper:2.4.4'
   // JSON 파싱을 위한 Jackson
   implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

   implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

   implementation files('libs/jxl-2.6.12.jar')
   
   // Lombok
   compileOnly 'org.projectlombok:lombok'
   annotationProcessor 'org.projectlombok:lombok'

   developmentOnly 'org.springframework.boot:spring-boot-devtools'
   runtimeOnly 'mysql:mysql-connector-java:8.0.33'
   annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
   
   testImplementation 'org.springframework.boot:spring-boot-starter-test'
   testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
   testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

   implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

   //박정민이 추가한 거
   
   //본인인증용
   implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: '2.4.5'
	implementation 'net.nurigo:sdk:4.2.7'

   //jwt 토큰 생성용
   implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

   // Webflux (선택: 비동기 API 호출)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
   // Thymeleaf (선택)
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

   //임채은이 추가한 거
   implementation 'com.amazonaws:aws-java-sdk-s3:1.11.238'
   implementation 'javax.xml.bind:jaxb-api:2.3.1'
   implementation 'org.glassfish.jaxb:jaxb-core:2.3.0'
   implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.3'


}

tasks.named('test') {
   useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}

